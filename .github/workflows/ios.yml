name: ios
# The game for iPhone and iPad, and nothing else: the Rust game cross-compiled for aarch64-apple-ios, wrapped by
# packaging/ios/project.yml's HorizonGame target, and uploaded as an unsigned .ipa. No tests run here. Every build —
# a commit's CI run, a pull request, or the 06:00 America/New_York nightly schedule — replaces the .ipa on the single
# `ios-nightly` pre-release, which always carries the newest build and names the commit it was made from in its notes.
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
  schedule:
    # 06:00 New York, whether Eastern Daylight or Standard time (GitHub cron evaluates in UTC).
    - cron: '11 10 * * *'
permissions:
  contents: write      # creating/updating the ios-nightly pre-release and its assets
concurrency:
  group: ios-${{ github.sha }}
  cancel-in-progress: false
env:
  HORIZON_TELEMETRY_URL: "off"
  IOS_TARGET: aarch64-apple-ios
  # `--release` with the `fast` profile's codegen: the release profile's single codegen unit and LTO cost minutes
  # and the unsigned bundle is a test build.
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_INCREMENTAL: "0"
  # The app's own minimum (project.yml); rustc and cc read it, and the Xcode step's Cargo phase sees the same.
  IPHONEOS_DEPLOYMENT_TARGET: "15.0"

jobs:
  ipa:
    # The native launcher uses the iOS 26 SDK (Liquid Glass). macos-15 defaults to Xcode 16.4.
    # MAC_RUNNER remains available for a maintainer-provided runner with Xcode 26 or newer.
    runs-on: ${{ github.event_name == 'pull_request' && 'macos-26' || vars.MAC_RUNNER || 'macos-26' }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check the Apple toolchain
        run: bash tools/ci/ios-toolchain.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.IOS_TARGET }}
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          shared-key: ios-${{ env.IOS_TARGET }}

      - name: Test frame generation on the macOS Metal backend
        env:
          WGPU_BACKEND: metal
        run: cargo test --locked -p horizon-client-render --lib gfx::frame_gen:: -- --nocapture
      - name: Build the game
        # The Microsoft sign-in app (msa.rs): a repository variable overrides the built-in one; unset, it stays.
        env:
          HORIZON_MSA_CLIENT_ID: ${{ vars.HORIZON_MSA_CLIENT_ID }}
        # The defaults minus `controllers` (GameController reads pads), with `audio`: project.yml's Cargo phase
        # uses the same flags, so HORIZON_GAME_PREBUILT below finds this build.
        run: cargo build --release --locked --target "$IOS_TARGET" -p horizon-client --no-default-features --features audio
      - name: Bundle it
        env:
          HORIZON_MSA_CLIENT_ID: ${{ vars.HORIZON_MSA_CLIENT_ID }}
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          ( cd packaging/ios && xcodegen generate )
          HORIZON_GAME_PREBUILT=1 xcodebuild -project packaging/ios/HorizonIOS.xcodeproj \
            -target HorizonGame -configuration Release -sdk iphoneos -arch arm64 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY= CODE_SIGNING_REQUIRED=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            CONFIGURATION_BUILD_DIR="$PWD/build-ios" \
            build > xcode-game-build.log 2>&1 || { tail -60 xcode-game-build.log; exit 1; }
          python3 - <<'PYCONFIG'
          import os, plistlib
          path = 'build-ios/HorizonGame.app/Info.plist'
          with open(path, 'rb') as file:
              info = plistlib.load(file)
          info['HorizonMSAClientID'] = os.environ.get('HORIZON_MSA_CLIENT_ID', '')
          with open(path, 'wb') as file:
              plistlib.dump(info, file)
          PYCONFIG
          rm -rf game-xcode && mkdir -p game-xcode/Payload
          cp -a build-ios/HorizonGame.app game-xcode/Payload/
          ( cd game-xcode && zip -qry ../Horizon-game-unsigned.ipa Payload )
      - name: Preserve the Xcode failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcode-failure-log
          path: xcode-game-build.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Check the distributable contains no prepared assets
        run: |
          python3 - <<'PYASSETS'
          import zipfile
          with zipfile.ZipFile('Horizon-game-unsigned.ipa') as ipa:
              if any('horizon-resources.json' in name for name in ipa.namelist()):
                  raise SystemExit('::error::the .ipa carries prepared vanilla assets; refusing to publish it')
          PYASSETS
      - uses: actions/upload-artifact@v4
        with:
          name: horizon-ios-game
          path: Horizon-game-unsigned.ipa
          retention-days: 7
          if-no-files-found: error
      - name: Publish on the ios-nightly pre-release
        # The one place people try the newest iOS build: every CI build (a commit on main, a pull request, or the
        # 06:00 New York schedule) replaces the .ipa on this single pre-release. Its notes always name the newest
        # commit built and uploaded here. Forks have no releases to publish to.
        if: github.repository == 'datlun2k11-pixel/a-bit-better-horizon-ios'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          REF_NAME: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          date=$(date -u +%Y-%m-%d)
          {
            echo "## Horizon iOS Nightly — unsigned test build"
            echo
            echo "> [!WARNING]"
            echo "> This build has **not been reviewed or tested carefully**. It is an unsigned nightly for trying out"
            echo "> the newest changes on iPhone and iPad; expect bugs and install it at your own risk."
            echo
            echo "**Latest commit built and uploaded:** \`${COMMIT}\` (\`${REF_NAME}\`, $date)"
            echo
            echo "Download \`Horizon-game-unsigned.ipa\` below and install it with your developer tooling (AltStore,"
            echo "Sideloadly, Xcode, …): the .ipa is unsigned, so it must be re-signed for your own device."
          } > notes.md
          # Recreate the release rather than edit it. GitHub's Releases page orders everything below the
          # one "Latest" release by each release's created_at, and no API call can change that date: a
          # release edited in place keeps its original date and sinks below every newer release. Deleted
          # and created again, it is the newest release object, so the nightly stays at the top of the list.
          # A prerelease can never take the "Latest" slot itself. `--target main` keeps the recreated tag
          # pointing at main even when a pull request's build publishes it. The tag page is briefly gone
          # between the two commands; the tag name, and so the release URL people bookmark, never changes.
          gh release delete ios-nightly --yes --cleanup-tag 2>/dev/null || true
          gh release create ios-nightly --prerelease --latest=false --target main \
            --title "iOS Nightly · $date · ${COMMIT:0:7}" \
            --notes-file notes.md \
            Horizon-game-unsigned.ipa